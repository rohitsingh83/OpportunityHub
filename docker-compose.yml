version: '3.8'

services:
  backend:
    build: ./backend
    container_name: opportunity-hub-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - USE_IN_MEMORY_DB=true
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: opportunity-hub-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

